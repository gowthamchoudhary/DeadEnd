[project]
name = "deadend-runner"
version = "0.2.2"
description = "DeadEnd memory and verification agent: Entire session search, coding-agent adapters, MCP, and run recording"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.scripts]
deadend-runner = "deadend_runner.cli:app"
deadend-mcp = "deadend_runner.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deadend_runner"]
