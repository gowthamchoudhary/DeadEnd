[project]
name = "deadend-runner"
version = "0.2.0"
description = "DeadEnd local runner: agent-agnostic adapters (claude-code, codex, opencode, pi, antigravity, copilot-cli), MCP server, run recording"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.scripts]
deadend-runner = "deadend_runner.cli:app"
deadend-mcp = "deadend_runner.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
